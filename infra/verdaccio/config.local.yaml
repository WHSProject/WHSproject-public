# Verdaccio 설정 (WHSProject)
#
# 전제
#   - 취약점 판정은 Policy Engine이 수행한다.
#   - Verdaccio는 Gateway가 전달한 승인 목록을 기준으로 Package를 준비한다.
#   - 외부 Host Port를 공개하지 않는다. 유일한 진입점은 Gateway.

# 외부 Registry 경로 접두사. Gateway가 https://<gw>/npm/... 로 받아
# /npm 을 제거한 뒤 Verdaccio로 전달한다.
#   - 라우팅에는 영향 없음. Verdaccio는 접두사가 제거된 경로를 받는다(실측).
#   - VERDACCIO_PUBLIC_URL 과 조합되어 dist.tarball URL을 만든다.
#     VERDACCIO_PUBLIC_URL=https://gw  +  url_prefix=/npm/
#       -> https://gw/npm/{pkg}/-/{file}.tgz
url_prefix: /npm/

storage: /verdaccio/storage/data
plugins: /verdaccio/plugins

# Web UI 미사용
# 주의: 키 이름은 'enable' 이다. 이미지에 들어있는 기본 config 주석에는
# 'enabled' 로 적혀 있으나 그 키는 무시되고 Web UI가 그대로 노출된다(실측).
web:
  enable: false

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    algorithm: bcrypt
    rounds: 10
    # 사용자 직접 가입 비활성화.
    # 초기 계정은 scripts/bootstrap-users.sh 로 먼저 생성한 뒤 이 값을 적용한다.
    max_users: -1

uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    maxage: 2m
    # npmjs Uplink 요청 timeout. 장애 시 Cache MISS 가 붙잡히는 시간을 줄이려고
    # 기본값보다 낮춘다. Client 전체 응답시간의 상한은 아니며, 무응답 상황의 최종
    # 응답은 이 값보다 길게 걸릴 수 있다(재시도 경로).
    timeout: 10s
    # npm install 중 다수의 독립 Metadata/Tarball 요청이 발생하므로
    # 기본값(max_fails 2)이면 일시 실패 몇 건에 uplink 전체가 차단된다.
    max_fails: 5
    # uplink 차단 유지 시간. npmjs 가 복구되어도 이 시간 동안은 Cache MISS 가
    # 계속 막힌다. 5m 이면 재시작 전까지 풀리지 않았고 1m 에서는 약 40초에
    # 자동 복구됐다(실측).
    # 짧을수록 재시도 창이 자주 열려, 장애가 이어지는 동안 max_fails 에 도달하기
    # 전까지 느린 요청이 반복된다. maxage 가 만료된 Cache 조회도 이 구간에 걸린다.
    fail_timeout: 1m
    cache: true

# 위에서부터 첫 매칭이 적용된다. @whs/* 가 @*/* 보다 반드시 위에 있어야 한다.
packages:
  '@whs/*':
    access: $authenticated
    publish: admin whs-ci
    unpublish: admin
    # proxy 없음 - dependency confusion 방어의 핵심.
    # 이 블록에 proxy를 추가하면 내부 패키지명이 npmjs로 새어나간다.

  # 외부 Package: proxy/cache 전용.
  #   publish   - 존재하지 않는 group을 지정해 admin 을 포함한 전 계정을 차단한다.
  #               외부 Package와 같은 이름으로 로컬 배포해 npmjs Package를
  #               가리는 것을 막기 위함.
  #   unpublish - admin 만 허용. 차단 수단이 아니라 캐시 정리 수단이다
  #               (지워도 다음 요청에서 npmjs 로부터 다시 받아온다).
  #               단, publish 를 막았으므로 '버전 단위' 삭제는 불가능하다.
  #               npm unpublish pkg@ver 는 PUT /{pkg}/-rev/{rev} 를 쓰고
  #               Verdaccio 가 publish 와 unpublish 권한을 모두 요구하기 때문(실측).
  #               외부 Package는 패키지 전체 삭제(DELETE)만 가능하다.
  '@*/*':
    access: $authenticated
    publish: no-publish
    unpublish: admin
    proxy: npmjs

  '**':
    access: $authenticated
    publish: no-publish
    unpublish: admin
    proxy: npmjs

# publish 대상은 @whs/* 내부 패키지
max_body_size: 100mb

publish:
  allow_offline: false

server:
  keepAliveTimeout: 60
  # Gateway 뒤에 있으므로 실제 클라이언트 IP를 인식시킨다.
  # 켜지 않으면 모든 요청/로그인 시도가 Gateway IP 하나로 집계된다.
  # config.yaml은 환경변수 치환을 지원하지 않으므로 리터럴로 적는다.
  # 값은 compose.yaml 의 whs network subnet과 반드시 일치해야 한다.
  # 벗어나면 X-Forwarded-For 가 무시되어 모든 요청이 Gateway IP로 집계된다.
  trustProxy: '172.28.0.0/24'
  legacyAuthCache:
    enabled: false

security:
  api:
    # 명시하지 않으면 legacy 토큰이 발급되고, legacyAuthCache가 꺼져 있어
    # 요청마다 bcrypt 검증이 돈다(실측 +79ms/req -> JWT +20ms/req).
    jwt:
      sign:
        expiresIn: 7d

# 로그인/계정 API 전용 제한. 패키지 요청에는 적용되지 않는다.
userRateLimit:
  windowMs: 900000
  max: 100

middlewares:
  # Verdaccio 기본 제공 감사 Plugin. 아래 whs-audit 과 다른 Plugin이다.
  audit:
    enabled: false
  # 보안 이벤트를 구조화 로그로 남긴다. Guard보다 먼저 등록해야 차단된 요청의
  # 응답 결과까지 관측할 수 있다.
  whs-audit:
    enabled: true
  whs-approval:
    endpoint: /-/whs/approvals
    # 최종 MVP Integration에서는 Gateway의 ACCEPT 등록을 통과한
    # Version/Tarball만 Registry에서 허용한다.
    guard_enabled: true
    # Approval API 서비스 인증. Gateway 가 Authorization: Bearer 로 보내는 Token 을
    # WHS_APPROVAL_SERVICE_TOKEN 과 대조한다. Token 이 비어 있거나 다르면 401 이다.
    # 생략해도 켜진다(guard_enabled 와 같은 기준). false 는 연동 문제를 가릴 때만 쓴다.
    service_auth_enabled: true
    # Approval 하나가 유효한 시간(초). 등록 시각에 더해 만료 시각을 계산한다.
    # 잠정값이며 최종 기본값·최대값은 Gateway Contract 협의 후 확정한다.
    # 생략하거나 잘못된 값을 넣으면 Plugin 기본값(3600)이 적용된다.
    approval_ttl_seconds: 3600
  # 저장된 Tarball 을 해싱해 Metadata integrity 와 대조하는 수동 검사 API.
  whs-integrity:
    endpoint: /-/whs/integrity/checks
    # 수동 검사 API 를 호출할 수 있는 Verdaccio 계정. htpasswd 에는 Group 이 없어
    # 계정 이름으로 지정한다. 생략하면 admin 만 허용한다.
    allowed_users: [admin]
    # 정기 검사 주기(초). 생략하면 정기 검사를 하지 않는다. 60 이상 정수만 받는다.
    # 기동 직후에는 돌지 않고 첫 주기가 지난 뒤 처음 실행한다. 재시작하면 타이머도
    # 처음부터 다시 세므로, 자주 재시작하는 환경에서 주기가 길면 한 번도 돌지 않을
    # 수 있다. 캐시 목록은 저장소마다 다르게 뽑는다(로컬은 Storage Plugin 의 search,
    # S3 는 버킷 직접 조회. README 참고). 결과를 가져갈 곳(Gateway 연동)이 생기면 주석을 푼다.
    # check_interval_seconds: 3600

log:
  type: stdout
  format: json
  level: http
