name: "✨ Feature"
description: "새로운 기능 또는 기능 개선 작업"
title: "[FEAT] "
labels: []
type: feature

body:
  - type: markdown
    attributes:
      value: |
        새로운 기능 또는 기능 개선을 위한 Issue입니다.
        필요한 항목만 작성해주세요.

  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 왜 필요한 기능인지 작성해주세요.
      placeholder: |
        예)
        Gateway에서 Scanner timeout 상황을 처리할 수 있도록 합니다.

  - type: dropdown
    id: component
    attributes:
      label: 관련 Component
      description: 관련된 Component가 있다면 선택해주세요.
      multiple: true
      options:
        - Gateway
        - Policy
        - Scanner
        - Verdaccio
        - Data / Feeds
        - Database
        - Dashboard
        - DevOps / QA
        - 기타

  - type: textarea
    id: requirements
    attributes:
      label: 구현할 내용
      description: 현재 알고 있는 요구사항이나 작업 내용을 작성해주세요.
      placeholder: |
        예)
        - Scanner timeout 처리
        - 실패 응답 처리
        - 기존 정상 흐름 유지

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 완료 기준이 명확한 경우 작성해주세요.
      placeholder: |
        예)
        - timeout 상황에서 오류 응답이 반환된다.
        - 기존 정상 요청에 영향이 없다.

  - type: textarea
    id: reference
    attributes:
      label: 관련 문서 / WBS
      description: 관련된 문서나 WBS가 있다면 작성해주세요.
      placeholder: |
        WBS:
        API:
        Related Issue:
        Notion:

  - type: textarea
    id: notes
    attributes:
      label: 참고사항
      description: 추가로 공유할 내용이 있다면 작성해주세요.