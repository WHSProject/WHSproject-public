version: 2

# This file must also reach main (the default branch) to activate Dependabot.
# Routine version-update PRs are disabled to avoid unreviewed major upgrades.
# Dependabot alerts and security updates remain enabled in repository settings.
# GitHub security updates target main independently; see workflows/README.md.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    # Security fixes are handled through alerts/security updates and reviewed manually.
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directories:
      - /
      - /apps/gateway
      - /apps/dashboard
      - /infra/verdaccio/storage-plugins
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /apps/policy
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directories:
      - /apps/gateway
      - /apps/scanner
      - /apps/dashboard
      - /apps/policy
      - /infra/verdaccio
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 0
